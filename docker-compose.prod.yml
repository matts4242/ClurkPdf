# Production stack: Postgres, the API server, and Caddy in front of both.
#
#   ./scripts/deploy.sh            build and start everything
#   docker compose -f docker-compose.prod.yml logs -f
#   docker compose -f docker-compose.prod.yml down
#
# Settings come from `.env` in this directory; see deploy/env.example.

name: clurkpdf

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: invoice_processor
    volumes:
      - db_data:/var/lib/postgresql/data
    # No published port: only the server container needs to reach the database.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U invoice -d invoice_processor']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  server:
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://invoice:${POSTGRES_PASSWORD}@db:5432/invoice_processor?schema=public
      # Caddy puts the API on the same origin as the page, so CORS never comes
      # into play in this stack. The value is kept honest anyway.
      CLIENT_ORIGIN: ${PUBLIC_URL:-http://localhost}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
      PAGE_DPI: ${PAGE_DPI:-150}
      OCR_LANGUAGE: ${OCR_LANGUAGE:-eng}
      OCR_CONCURRENCY: ${OCR_CONCURRENCY:-2}
    volumes:
      # Uploaded PDFs and rendered pages. Losing this volume loses the files;
      # the database rows would survive and point at nothing.
      - uploads:/app/server/uploads
      # Tesseract language data, fetched once on the first OCR run.
      - tesseract:/app/server/.tesseract-cache
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        # Empty: the client calls its own origin and Caddy routes /api onwards.
        VITE_SERVER_ORIGIN: ''
        VITE_PAGE_DPI: ${PAGE_DPI:-150}
    restart: unless-stopped
    depends_on:
      - server
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      # Certificates and Caddy's own state. Without this volume a redeploy
      # would request a new certificate every time and hit rate limits.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  uploads:
  tesseract:
  caddy_data:
  caddy_config:
