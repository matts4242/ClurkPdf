name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check, test, build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # pdfjs-dist needs >=22.13 and vitest needs ^22.12, so 20.x cannot run
        # this project. These are the two current LTS lines.
        node-version: ['22.x', '24.x']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: invoice
          POSTGRES_PASSWORD: password
          POSTGRES_DB: invoice_processor_test
        ports:
          - 5432:5432
        # Do not start the job until the database answers.
        options: >-
          --health-cmd "pg_isready -U invoice -d invoice_processor_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://invoice:password@127.0.0.1:5432/invoice_processor_test?schema=public
      DATABASE_URL: postgresql://invoice:password@127.0.0.1:5432/invoice_processor_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # Tesseract downloads a ~5MB language file on first use. Cache it so the
      # OCR tests do not refetch it on every run.
      - name: Cache Tesseract language data
        uses: actions/cache@v4
        with:
          path: server/.tesseract-cache
          key: tesseract-${{ runner.os }}-eng

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
