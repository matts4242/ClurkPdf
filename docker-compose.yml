# Local PostgreSQL and Redis for development and tests.
#
#   docker compose up -d
#
# Creates the development database. The test database is created alongside it
# by the init script below, because the test suite refuses to run against any
# database whose name does not end in `_test`.
#
# Redis backs the Week 5 processing queue and the progress events it publishes.
# Tests namespace their own keys under a random prefix, so they share this
# instance without being able to see a development queue.

services:
  postgres:
    image: postgres:16-alpine
    container_name: invoice-processor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: password
      POSTGRES_DB: invoice_processor
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U invoice -d invoice_processor']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: invoice-processor-queue
    restart: unless-stopped
    # A queue is a work list, not a store of record: every job's real state is
    # a row in PostgreSQL, so persistence here would only slow writes down.
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
